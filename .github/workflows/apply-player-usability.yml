name: Apply player usability corrections
on:
  push:
    branches: [feat/enhanced-media-player]
    paths: [.github/workflows/apply-player-usability.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'dandibbert/TelegramSwift' && github.ref == 'refs/heads/feat/enhanced-media-player'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply exact source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path.cwd().resolve()
          parts = [root / '.github/player-fix-v2' / f'{i}.b64' for i in range(3)]
          payload = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(payload).hexdigest() == 'a0a47927f3efba811ed6ee29dffe6c3978092f9775e0fb5a9b7447848f20e3cc'
          changes = json.loads(lzma.decompress(payload))
          for name, spec in changes.items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('Telegram-Mac/', 'Telegram.xcodeproj/', 'packages/EnhancedMediaPlayer/', 'packages/ApiCredentials/', 'docs/', 'scripts/ci-build-player.sh'))
              p = root / path
              assert p.resolve().is_relative_to(root) and not p.is_symlink()
              if spec['base'] is None:
                  assert not p.exists(), f'Refusing to overwrite new file: {name}'
              else:
                  assert hashlib.sha256(p.read_bytes()).hexdigest() == spec['base'], f'Unexpected base: {name}'
              if spec['result'] is None:
                  p.unlink()
                  continue
              if 'content' in spec:
                  after = spec['content'].encode()
              else:
                  lines = p.read_text().splitlines(keepends=True)
                  for start, count, content in reversed(spec['chunks']):
                      assert 0 <= start <= len(lines) and 0 <= count <= len(lines) - start
                      lines[start:start+count] = [content]
                  after = ''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest() == spec['result'], f'Incorrect result: {name}'
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(after)
          for p in parts:
              p.unlink()
          parts[0].parent.rmdir()
          print(f'Verified all {len(changes)} source changes')
          PY
          bash -n scripts/ci-build-player.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Telegram-Mac Telegram.xcodeproj packages/ApiCredentials packages/EnhancedMediaPlayer docs scripts/ci-build-player.sh .github/player-fix-v2
          git commit -m 'fix: use native settings, responsive serial seeks and rendered HUDs [skip ci]'
          git push origin HEAD:refs/heads/feat/enhanced-media-player
