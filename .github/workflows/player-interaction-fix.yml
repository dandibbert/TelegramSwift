name: Finalize player interaction routing
on:
  push:
    branches: [feat/enhanced-media-player]
    paths: [.github/workflows/player-interaction-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'dandibbert/TelegramSwift' && github.ref == 'refs/heads/feat/enhanced-media-player'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact checked source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          def patch(name, digest, edits):
              p = pathlib.Path(name)
              data = p.read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, f'Unexpected source: {name}'
              text = data.decode()
              for before, after in edits:
                  assert text.count(before) == 1, f'Non-unique edit in {name}'
                  text = text.replace(before, after, 1)
              p.write_text(text)
          patch('packages/EnhancedMediaPlayer/Sources/EnhancedMediaPlayer/PlayerInputController.swift',
            '15307791a8f1a0127a8afa06b27c66f0da77dc6f7c33fed55f2a395014b53b16', [
              ('    private func handle(_ event: NSEvent) -> NSEvent? {', '    // Internal so integration tests exercise real event routing, not just commands.\n    func handle(_ event: NSEvent) -> NSEvent? {'),
              ('[UInt16(123),124,49,3].contains(shortcut.keyCode)', '[UInt16(123),124,49,3,53].contains(shortcut.keyCode)'),
              ('        if event.type == .leftMouseUp, event.clickCount == 2 {', '''        // The gallery normally closes on the FIRST mouse-up. Consume a canvas
                  // click while double-click playback gestures are enabled, otherwise its
                  // second click would target a gallery which has already disappeared.
                  // Actual controls and clicks outside the video were excluded above.
                  if event.type == .leftMouseUp, event.clickCount == 1,
                     target.playerPresentation == .gallery, store.preferences.doubleClick != .none {
                      target.playerShowControls(true)
                      return nil
                  }
                  if event.type == .leftMouseUp, event.clickCount == 2 {''')])
          patch('Telegram-Mac/GalleryViewer.swift',
            '9eee94ea252d8eb394af6331754cb92f613267de3d2a9e89e65fa3c44e2851c3', [
              ('    @objc open func windowDidResignKey() {\n        self.window.makeKeyAndOrderFront(self)', '''    @objc open func windowDidResignKey() {
                  // Enhanced video controls may open a settings window or hand focus to
                  // another app. Do not immediately steal it back from the user's target.
                  if PlayerSettingsStore.shared.preferences.enabled, pager.selectedItem is MGalleryVideoItem { return }
                  self.window.makeKeyAndOrderFront(self)''')])
          patch('Telegram-Mac/SVideoView.swift',
            'ccd25e1a184f87752c503b323cb318325a7fc70df70d48ff73c58c5470229386', [
              ('''            let local = pip.convert(point, from: self)
                      let controls: [NSView] = [pip.playOrPause, pip.progress, pip.volumeSlider, pip.volumeToggle, pip.close, pip.fullscreen]
                      if controls.contains(where: { !$0.isHidden && $0.frame.contains(local) }) { return false }''', '''            let controls: [NSView] = [pip.playOrPause, pip.progress, pip.volumeContainer, pip.close, pip.fullscreen]
                      if controls.contains(where: { !$0.isHiddenOrHasHiddenAncestor && $0.bounds.contains($0.convert(point, from: self)) }) { return false }'''),
              ('            image = optionsRateImage(rate: String(format: "%.1fx", FastSettings.playingVideoRate), color: .white, isLarge: true)', '            image = optionsRateImage(rate: String(format: "%.1fx", status?.baseRate ?? FastSettings.playingVideoRate), color: .white, isLarge: true)'),
              ('        controls.menuItems.contextMenu = { [weak self] in\n            let menu = ContextMenu(presentation: .current(darkPalette))', '''        controls.menuItems.contextMenu = { [weak self] in
                      // TGUIKit's custom menu requires its own Window subclass. The mini
                      // player is a genuine NSPanel, so use an NSMenu there instead.
                      let nativeMenu = self?.window != nil && !(self?.window is Window)
                      let menu = ContextMenu(presentation: .current(darkPalette), isLegacy: nativeMenu)
                      let currentRate = self?.status?.baseRate ?? FastSettings.playingVideoRate'''),
              ('''            let customItem = ContextMenuItem(String(format: "%.1fx", FastSettings.playingVideoRate), image: NSImage(cgImage: generateEmptySettingsIcon(), size: NSMakeSize(24, 24)))
                      
                      menu.addItem(SliderContextMenuItem(volume: FastSettings.playingVideoRate, minValue: 0.2, maxValue: 2.5, midValue: 1, drawable: MenuAnimation.menu_speed, drawable_muted: MenuAnimation.menu_speed, { [weak self] value, _ in
                          customItem.title = String(format: "%.1fx", value)
                          self?.interactions?.setBaseRate(value)
                          self?.controls.updateBaseRate()
                      }))
                      
                      menu.addItem(customItem)
                      
                      if FastSettings.playingVideoRate != 1.0 {''', '''            if nativeMenu {
                          for rate in [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5] {
                              menu.addItem(ContextMenuItem(String(format: "%.3g×", rate), handler: { [weak self] in
                                  DispatchQueue.main.async { self?.interactions?.setBaseRate(rate) }
                              }, state: abs(currentRate - rate) < 0.001 ? .on : nil))
                          }
                      } else {
                          let customItem = ContextMenuItem(String(format: "%.1fx", currentRate), image: NSImage(cgImage: generateEmptySettingsIcon(), size: NSMakeSize(24, 24)))
                          menu.addItem(SliderContextMenuItem(volume: currentRate, minValue: 0.25, maxValue: 2.5, midValue: 1, drawable: MenuAnimation.menu_speed, drawable_muted: MenuAnimation.menu_speed, { [weak self] value, _ in
                              customItem.title = String(format: "%.1fx", value)
                              self?.interactions?.setBaseRate(value)
                              self?.controls.updateBaseRate()
                          }))
                          menu.addItem(customItem)
                      }
                      
                      if currentRate != 1.0 {''')])
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Telegram-Mac/GalleryViewer.swift Telegram-Mac/SVideoView.swift packages/EnhancedMediaPlayer/Sources/EnhancedMediaPlayer/PlayerInputController.swift
          git commit -m 'fix: preserve gallery double clicks, settings focus and native mini menus [skip ci]'
          git push origin HEAD:refs/heads/feat/enhanced-media-player
