name: Enhanced Media Player
on:
  push:
    branches: [feat/enhanced-media-player]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enhanced-player-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test player engine and AppKit integration
        run: |
          if [ -f packages/EnhancedMediaPlayer/Package.swift ]; then
            swift test --package-path packages/EnhancedMediaPlayer
          else
            echo 'Preparing the feature package; full dependency build is running separately.'
          fi
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build application
        run: bash scripts/ci-build-player.sh
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Player-macOS-${{ github.run_number }}
          path: build/Telegram-Player-macOS.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: build/logs
          retention-days: 7
