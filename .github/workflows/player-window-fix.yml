name: Finalize player window layout
on:
  push:
    branches: [feat/enhanced-media-player]
    paths: [.github/workflows/player-window-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'dandibbert/TelegramSwift' && github.ref == 'refs/heads/feat/enhanced-media-player'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact checked source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          edits = [
              ('packages/EnhancedMediaPlayer/Sources/EnhancedMediaPlayer/PlayerSettingsWindow.swift',
               'cd28709b5c3ec99a76ed2389a148c81bf3ef803de6c0084202c96e98e67f0c3b',
               '        window?.contentView?.layoutSubtreeIfNeeded()\n        scroll.contentView.scroll(to: .zero)',
               '        window?.contentView?.layoutSubtreeIfNeeded()\n        // Retile after document height reveals a legacy scrollbar, then resolve\n        // its reduced viewport width before the first frame is displayed.\n        scroll.tile()\n        window?.contentView?.layoutSubtreeIfNeeded()\n        scroll.contentView.scroll(to: .zero)'),
              ('Telegram-Mac/PIPVideoWindow.swift',
               '9f83e920facdea9a7455d2761495c6620f2204b0a5501b40b77303b3b4b0631a',
               '        next.backgroundColor = .black',
               '        next.backgroundColor = presentation == .mini ? .clear : .black\n        next.isOpaque = presentation != .mini\n        next.hasShadow = true')
          ]
          for name, digest, before, after in edits:
              p = pathlib.Path(name)
              data = p.read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, f'Unexpected source: {name}'
              text = data.decode()
              assert text.count(before) == 1, f'Non-unique edit in {name}'
              p.write_text(text.replace(before, after, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Telegram-Mac/PIPVideoWindow.swift packages/EnhancedMediaPlayer/Sources/EnhancedMediaPlayer/PlayerSettingsWindow.swift
          git commit -m 'fix: resolve legacy scrollbar layout and transparent mini-player corners [skip ci]'
          git push origin HEAD:refs/heads/feat/enhanced-media-player
