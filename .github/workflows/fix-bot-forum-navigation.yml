name: Apply bot forum navigation stability fix
on:
  push:
    branches: [feat/enhanced-media-player]
    paths: [.github/workflows/fix-bot-forum-navigation.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'dandibbert/TelegramSwift'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact navigation corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              if text.count(before) != 1:
                  raise SystemExit(f'Expected one match in {path}, got {text.count(before)}')
              p.write_text(text.replace(before, after, 1))

          helper_anchor = 'class ChatController: EditableViewController<ChatControllerView>, Notifable, TableViewDelegate {'
          helper = '''// A bot can be discovered as forum-capable after its chat controller is already\n// onscreen. Channel forum-mode changes still rebuild navigation, but a user/bot\n// capability upgrade must preserve the current chat/thread selection.\nfunc shouldRemoveChatForForumTransition(becameForum: Bool, isUserCapabilityUpgrade: Bool,\n                                        lostThreadInfo: Bool, displayForumAsTabs: Bool,\n                                        isMonoForum: Bool) -> Bool {\n    guard !isMonoForum else { return false }\n    if becameForum && !isUserCapabilityUpgrade { return true }\n    return lostThreadInfo && !displayForumAsTabs\n}\n\n''' + helper_anchor
          replace_once('Telegram-Mac/ChatController.swift', helper_anchor, helper)

          old_condition = '''            if let peer = value.mainPeer, let oldPeer = oldValue.mainPeer {\n                if peer.isForum && !oldPeer.isForum || (oldValue.threadInfo != nil && value.threadInfo == nil && !peer.displayForumAsTabs), !peer.isMonoForum {\n                    self.navigationController?.removeImmediately(self)\n                }\n            }'''
          new_condition = '''            if let peer = value.mainPeer, let oldPeer = oldValue.mainPeer {\n                let becameForum = peer.isForum && !oldPeer.isForum\n                let userCapabilityUpgrade = becameForum && peer is TelegramUser && oldPeer is TelegramUser\n                if shouldRemoveChatForForumTransition(\n                    becameForum: becameForum,\n                    isUserCapabilityUpgrade: userCapabilityUpgrade,\n                    lostThreadInfo: oldValue.threadInfo != nil && value.threadInfo == nil,\n                    displayForumAsTabs: peer.displayForumAsTabs,\n                    isMonoForum: peer.isMonoForum\n                ) {\n                    self.navigationController?.removeImmediately(self)\n                }\n            }'''
          replace_once('Telegram-Mac/ChatController.swift', old_condition, new_condition)

          old_peers = '''            } else if let peer = state.forumPeer?.peer, peer.displayForumAsTabs, peer.isForum {\n                switch self.mode {\n                case .forum:\n                    self.navigationController?.back()\n                default:\n                    break\n                }\n            }'''
          new_peers = '''            } else if let peer = state.forumPeer?.peer, peer.displayForumAsTabs, peer.isForum, peer is TelegramChannel {\n                // This back-navigation is only for channels switching to the\n                // integrated forum-tabs presentation. Bot forums are user peers\n                // and must keep their topic-list controller selected.\n                switch self.mode {\n                case .forum:\n                    self.navigationController?.back()\n                default:\n                    break\n                }\n            }'''
          replace_once('Telegram-Mac/PeersListController.swift', old_peers, new_peers)

          old_guard = '+        guard let user = transaction.getPeer(peerId) as? TelegramUser, user.botInfo != nil else { return nil }'
          new_guard = '+        guard let user = transaction.getPeer(peerId) as? TelegramUser, let bot = user.botInfo, !bot.flags.contains(.hasForum) else { return nil }'
          replace_once('scripts/patches/bot-forums.patch', old_guard, new_guard)

          smoke_anchor = '''            setDefaultTheme(for: window)\n            window.setContentSize(NSSize(width: 600, height: 680))'''
          smoke_new = '''            setDefaultTheme(for: window)\n            check(!shouldRemoveChatForForumTransition(becameForum: true, isUserCapabilityUpgrade: true, lostThreadInfo: false, displayForumAsTabs: true, isMonoForum: false),\n                  "Bot forum capability discovery preserves the current chat controller")\n            check(shouldRemoveChatForForumTransition(becameForum: true, isUserCapabilityUpgrade: false, lostThreadInfo: false, displayForumAsTabs: false, isMonoForum: false),\n                  "Channel forum-mode conversion keeps the original navigation rebuild")\n            check(!shouldRemoveChatForForumTransition(becameForum: false, isUserCapabilityUpgrade: false, lostThreadInfo: true, displayForumAsTabs: true, isMonoForum: false),\n                  "Integrated forum tabs do not discard a selected thread during refresh")\n            window.setContentSize(NSSize(width: 600, height: 680))'''
          replace_once('Telegram-Mac/PlayerAppSmoke.swift', smoke_anchor, smoke_new)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Telegram-Mac/ChatController.swift Telegram-Mac/PeersListController.swift Telegram-Mac/PlayerAppSmoke.swift scripts/patches/bot-forums.patch
          git commit -m 'fix: preserve bot topic selection during forum capability refresh [skip ci]'
          git push origin HEAD:feat/enhanced-media-player
